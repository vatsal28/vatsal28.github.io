<!DOCTYPE html>
$banner
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title</title>
  <meta name="description" content="$description">
$robots  <link rel="canonical" href="$canonical">
  <meta name="theme-color" content="#183b6b">
  <meta property="og:type" content="$og_type">
  <meta property="og:url" content="$canonical">
  <meta property="og:site_name" content="Vatsal Mishra">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:image" content="$og_image">
  <meta property="og:image:alt" content="$og_image_alt">
$extra_head  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@watt_cell">
  <meta name="twitter:title" content="$title">
  <meta name="twitter:description" content="$description">
  <meta name="twitter:image" content="$og_image">
  <link rel="alternate" type="application/atom+xml" title="Builds | Vatsal Mishra" href="/builds/feed.xml">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=cobalt-2-20260719">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/builds.css?v=$css_v">
  <script src="/assets/js/builds.js?v=$js_v" defer></script>
$jsonld</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="/">
      <img src="/assets/icons/w/vatsalos-mark.webp" alt="" width="24" height="24">
      <span>VatsalOS</span>
    </a>
    <nav class="topnav" aria-label="Site">
      $nav
    </nav>
    <div class="top-right">
      <a class="os-toggle" href="/os/" title="The original drag-the-windows desktop version of this site">
        <img src="/assets/icons/w/start-button.webp" alt="" width="20" height="20">Open VatsalOS
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1">
$body
  </main>

  <footer class="taskbar">
    <a class="os-toggle" href="/os/"><img src="/assets/icons/w/start-button.webp" alt="" width="20" height="20" loading="lazy">Open VatsalOS desktop</a>
    <span>Hand-built static site · Dublin</span>
    <a class="feed-link" href="/builds/feed.xml">Atom feed</a>
    <span class="spacer"></span>
    <span class="clock" id="clock" aria-hidden="true">--:--</span>
  </footer>
  <p class="sr-only" id="copy-status" role="status" aria-live="polite"></p>
</body>
</html>
